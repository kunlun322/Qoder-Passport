name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      # Step 2: run the sync action
      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@3863de47aaf0256b8dee9cded3dfed090b7270a2 # v3.4.3 + rev-list ambiguity fix (aormsby/Fork-Sync-With-Upstream-action#85)
        with:
          upstream_sync_repo: FoloToy/ai-passport
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 同步失败，请检查日志；若涉及上游 workflow 变更，请手动 Sync Fork，详见 docs/development/ci/CI-sync-main.md。"
          echo "[Error] Synchronization failed; inspect the logs. For upstream workflow changes, Sync the fork manually; see docs/development/ci/CI-sync-main.md."
          exit 1
